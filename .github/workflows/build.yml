name: build

on:
  push:
    branches: [ master, main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BATTERYHUB_KEYSTORE_B64: ${{ secrets.BATTERYHUB_KEYSTORE_B64 }}
      BATTERYHUB_KEYSTORE_PASSWORD: ${{ secrets.BATTERYHUB_KEYSTORE_PASSWORD }}
      BATTERYHUB_KEY_PASSWORD: ${{ secrets.BATTERYHUB_KEY_PASSWORD }}
      BATTERYHUB_KEY_ALIAS: ${{ secrets.BATTERYHUB_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Dépendances
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compter les tests exécutés
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in glob.glob('app/build/test-results/**/*.xml', recursive=True))
          print("tests exécutés :", total)
          if total == 0:
              raise SystemExit("aucun test exécuté")
          PY

      - name: APK release signé
        run: ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "batteryhub-v${VER}.apk"
          echo "APK=batteryhub-v${VER}.apk" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Vérifier la signature
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | tail -1)
          "${BT}/apksigner" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: batteryhub-apk
          path: batteryhub-v*.apk

      - name: Publier la release roulante
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          for i in 1 2 3 4 5; do
            gh release create latest "$APK" --title "BatteryHub $VER" --notes "Build automatique de la branche $GITHUB_REF_NAME" && break
            sleep 10
          done
